name: ci

# Deploy gate. deploy.yml keys on this workflow's success, so it holds only the
# checks that must block a release: typecheck + test + build. Biome lint runs in
# the separate lint.yml workflow and does NOT gate deploy.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
