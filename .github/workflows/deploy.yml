name: deploy

# Runs after ci.yml succeeds on main. Applies D1 migrations to the remote
# database, then deploys the Worker. Migration-first ordering means the new
# code rolls out into a schema that already has whatever it needs (additive
# migrations only — destructive ones must be staged across two deploys).
#
# Web app is deployed separately by Cloudflare Pages git integration; this
# workflow only handles the Worker + D1.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply token-rats --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api

      # Post-deploy smoke: deep health probe must return 200, else fail the job
      # so the deploy shows red and the canary/alerting picks it up.
      - name: Smoke test deep health
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://api.tokenrats.com/healthz)
          echo "healthz returned HTTP $code"
          test "$code" = "200"
