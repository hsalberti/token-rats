[package]
name = "token-rats-taskbar"
version = "0.1.0"
description = "Token Rats menu-bar / tray app"
edition = "2021"
rust-version = "1.77"
authors = ["Token Rats"]
license = "MIT"
publish = false

[lib]
name = "token_rats_taskbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-autostart = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
