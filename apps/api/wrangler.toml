name = "token-rats-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "token-rats"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../infra/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "CARDS"
bucket_name = "token-rats-cards"

[[durable_objects.bindings]]
name = "ROOM_LIVE"
class_name = "RoomLiveHub"

[[migrations]]
tag = "v2"
new_classes = ["RoomLiveHub"]

[triggers]
crons = ["0 16 * * 1"]   # Mondays 16:00 UTC — weekly digest

# Custom-domain routes. Primary is tokenrats.com; the legacy .dev hostname
# is kept as a parallel alias during migration so old CLI installs and
# previously-shared OG links keep working. Drop the .dev entry once usage
# has shifted (see roadmap-v1.1 Track W).
routes = [
  { pattern = "api.tokenrats.com", custom_domain = true },
  { pattern = "api.tokenrats.dev", custom_domain = true },
]

[vars]
# Canonical origin used for OAuth post-login redirects, CLI verification
# URLs, and the VAPID `mailto:` subject. CORS allows both .com and .dev
# (see src/index.ts) so a user landing on the legacy .dev host still
# completes auth, even though they finish on .com.
WEB_ORIGIN = "https://tokenrats.com"

# Secrets (set via `wrangler secret put`):
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   SESSION_SIGNING_KEY
#   VAPID_PRIVATE_KEY   (base64url-encoded raw 32-byte EC P-256 private key)
#   VAPID_PUBLIC_KEY    (base64url-encoded uncompressed P-256 point, 65 bytes)
