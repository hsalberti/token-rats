# Root wrangler config — see apps/api/wrangler.toml for the deployable Worker.
# This file documents the shared bindings for reference.

name = "token-rats-api"
main = "../apps/api/src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "token-rats"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "CARDS"
bucket_name = "token-rats-cards"

[vars]
WEB_ORIGIN = "https://tokenrats.dev"

# Secrets (set via `wrangler secret put`):
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   SESSION_SIGNING_KEY
